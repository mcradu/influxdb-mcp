[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "influxdb-mcp"
version = "0.4.1"
description = "Read-only MCP server for bounded access to InfluxDB 1.8"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "mcp>=1.9,<2",
  "pydantic-settings>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
influxdb-mcp = "influxdb_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/influxdb_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["influxdb_mcp/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
